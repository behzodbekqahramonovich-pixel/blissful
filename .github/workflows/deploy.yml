name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Manual trigger

jobs:
  # Build and Push Docker Images
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "version=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blissful-tour-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/blissful-tour-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/blissful-tour-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/blissful-tour-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Server
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.SERVER_PROJECT_PATH }}

            # Pull latest code
            git pull origin main

            # Pull latest Docker images
            docker pull ${{ secrets.DOCKER_USERNAME }}/blissful-tour-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/blissful-tour-frontend:latest

            # Stop and remove old containers
            docker-compose -f docker-compose.hub.yml down

            # Start new containers
            docker-compose -f docker-compose.hub.yml up -d

            # Wait for containers to be ready
            sleep 10

            # Run migrations
            docker-compose -f docker-compose.hub.yml exec -T backend python manage.py migrate

            # Collect static files
            docker-compose -f docker-compose.hub.yml exec -T backend python manage.py collectstatic --noinput

            # Clean up old images
            docker image prune -af

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ secrets.SERVER_URL }}/api/ || exit 1

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "✅ Deployment successful!"
          echo "URL: ${{ secrets.SERVER_URL }}"

      - name: Deployment Failed
        if: needs.deploy.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          exit 1
