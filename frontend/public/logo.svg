<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="planeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F3E8FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" opacity="1"/>

  <!-- Inner glow circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Globe lines -->
  <ellipse cx="100" cy="100" rx="50" ry="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <ellipse cx="100" cy="100" rx="50" ry="25" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <ellipse cx="100" cy="100" rx="25" ry="50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="50" y1="100" x2="150" y2="100" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="100" y1="50" x2="100" y2="150" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Airplane -->
  <g filter="url(#glow)" transform="translate(100, 100) rotate(-30) translate(-100, -100)">
    <!-- Airplane body -->
    <path d="M60 100 L90 95 L130 70 L145 72 L115 100 L130 125 L120 127 L100 105 L75 108 L70 115 L60 115 L65 105 L60 100Z"
          fill="url(#planeGradient)"
          stroke="rgba(255,255,255,0.5)"
          stroke-width="1"/>

    <!-- Wing -->
    <path d="M95 100 L85 130 L100 125 L105 105Z"
          fill="rgba(255,255,255,0.9)"/>

    <!-- Tail wing -->
    <path d="M70 102 L55 115 L65 115 L72 105Z"
          fill="rgba(255,255,255,0.8)"/>
  </g>

  <!-- Travel trail dots -->
  <circle cx="45" cy="130" r="3" fill="rgba(255,255,255,0.6)"/>
  <circle cx="35" cy="140" r="2.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="28" cy="148" r="2" fill="rgba(255,255,255,0.3)"/>

  <!-- Sparkle effects -->
  <circle cx="150" cy="60" r="2" fill="white" opacity="0.8"/>
  <circle cx="160" cy="80" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="55" cy="70" r="1.5" fill="white" opacity="0.5"/>
</svg>
